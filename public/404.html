<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
      const path = window.location.pathname;
      const search = window.location.search;

      window.location.replace(
        window.location.origin +
        '/?redirect=' +
        encodeURIComponent(path + search)
      );
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
